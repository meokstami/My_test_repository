<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>웹 챗봇</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="chat-app">
    <header class="chat-header">
      <button class="icon-btn" type="button" aria-label="뒤로">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 4.5 8 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1>웹 챗봇</h1>
      <div class="header-actions">
        <button class="icon-btn" type="button" aria-label="검색">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" type="button" aria-label="메뉴">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <section id="chat-window" class="chat-window" aria-live="polite"></section>

    <form id="chat-form" class="chat-form">
      <button class="plus-btn" type="button" aria-label="더보기">+</button>
      <input
        id="message-input"
        type="text"
        placeholder="메시지 입력"
        autocomplete="off"
      >
      <button id="send-button" type="submit" aria-label="보내기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 11.2 19 5.2l-6.2 14.2-2.1-6.1-6.2-2.1Z" fill="currentColor"/></svg>
      </button>
    </form>
  </main>

  <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
